# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(default:fallback_app_secret:file:APP_SECRET_FILE)%'
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers:
        - x-forwarded-for
        - x-forwarded-host
        - x-forwarded-proto
        - x-forwarded-port
        - x-forwarded-prefix

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
